<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png">
    <!-- Aggressive cache busting for HTML -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="build-timestamp" content="__BUILD_TIMESTAMP__">
    <title>Dance One Radio - The Castle of Dance</title>
    <meta name="description" content="Live stream of the newest dance and electronic music" />
    <meta name="author" content="Dance One Radio" />
    <!-- Critical CSS and font optimization -->
    <style>
      /* Inline critical font fallbacks to prevent layout shift */
      @font-face {
        font-family: 'Audiowide-fallback';
        src: local('Arial Black'), local('Impact');
        font-display: swap;
      }
      @font-face {
        font-family: 'Electrolize-fallback';
        src: local('Arial'), local('Helvetica');
        font-display: swap;
      }
      
      /* Use fallback fonts initially */
      .font-audiowide-loading { font-family: 'Audiowide-fallback', monospace; }
      .font-electrolize-loading { font-family: 'Electrolize-fallback', sans-serif; }
    </style>
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Critical resource preloading with high priority -->
    <link rel="preload" href="/lovable-uploads/c8f83eb5-b5ed-4bfd-88eb-604ca3cd2fe8.png" as="image" type="image/png" fetchpriority="high">
    <link rel="preload" href="/assets/dance-one-logo-DP6h_tTr.png" as="image" type="image/png">
    <link rel="preload" href="/assets/hero-bg-B-ZqE77g.jpg" as="image" type="image/jpeg">
    
    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="//s9.myradiostream.com">
    <link rel="dns-prefetch" href="//api.allorigins.win">
    <link rel="dns-prefetch" href="//images.unsplash.com">
    <link rel="dns-prefetch" href="//itunes.apple.com">
    
    <!-- Optimized font loading script with LCP optimization -->
    <script>
      // Inline critical performance optimizations
      (function() {
        // Font loading with performance optimization
        var fontLoadTimeout = setTimeout(function() {
          console.log('Font loading timeout, using fallbacks');
        }, 3000);
        
        function loadFonts() {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = 'https://fonts.googleapis.com/css2?family=Audiowide:wght@400&family=Electrolize:wght@400&display=swap';
          link.media = 'print';
          link.onload = function() {
            clearTimeout(fontLoadTimeout);
            this.media = 'all';
            document.documentElement.classList.add('fonts-loaded');
          };
          link.onerror = function() {
            clearTimeout(fontLoadTimeout);
            console.log('Font loading failed, using system fonts');
          };
          document.head.appendChild(link);
        }
        
        // Load fonts when DOM is ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', loadFonts);
        } else {
          loadFonts();
        }
      })();
      
      // Cache detection and invalidation system
      (function() {
        var currentBuild = document.querySelector('meta[name="build-timestamp"]')?.content || Date.now();
        var storedBuild = localStorage.getItem('app-build-timestamp');
        
        // Force reload if build timestamp changed
        if (storedBuild && storedBuild !== currentBuild) {
          console.log('New build detected, clearing caches...');
          localStorage.clear();
          sessionStorage.clear();
          if ('caches' in window) {
            caches.keys().then(function(cacheNames) {
              return Promise.all(cacheNames.map(function(cacheName) {
                return caches.delete(cacheName);
              }));
            }).then(function() {
              window.location.reload(true);
            });
          } else {
            window.location.reload(true);
          }
          return;
        }
        
        localStorage.setItem('app-build-timestamp', currentBuild);
      })();
      
      // Enhanced service worker registration with update detection
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js?v=' + Date.now())
            .then(function(registration) {
              console.log('SW registered: ', registration);
              
              // Check for updates every 30 seconds
              setInterval(function() {
                registration.update();
              }, 30000);
              
              // Handle service worker updates
              registration.addEventListener('updatefound', function() {
                var newWorker = registration.installing;
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('New service worker available, reloading...');
                    window.location.reload(true);
                  }
                });
              });
            })
            .catch(function(registrationError) {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PDHB9METW8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      
      gtag('config', 'G-PDHB9METW8');
    </script>
    
    <script defer src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4230589452649530" crossorigin="anonymous"></script>

    <meta property="og:title" content="Dance One Radio - The Castle of Dance" />
    <meta property="og:description" content="Live stream of the newest dance and electronic music" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/lovable-uploads/c8f83eb5-b5ed-4bfd-88eb-604ca3cd2fe8.png" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="/lovable-uploads/c8f83eb5-b5ed-4bfd-88eb-604ca3cd2fe8.png" />
  </head>

    <div id="root"></div>

  </body>
</html>
