<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dance One Radio - Live Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Orbitron', 'Rajdhani', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, hsl(var(--background)) 0%, hsl(var(--muted)) 100%);
            color: hsl(var(--foreground));
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
            --background: 222.2 84% 4.9%;
            --foreground: 210 40% 98%;
            --muted: 217.2 32.6% 17.5%;
            --primary: 210 40% 98%;
            --accent: 217.2 32.6% 17.5%;
            --destructive: 0 62.8% 30.6%;
        }
        
        .player-container {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }
        
        .player-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1) 0%, rgba(59, 130, 246, 0.05) 100%);
            z-index: -1;
        }
        
        .station-logo {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, hsl(263, 85%, 65%) 0%, hsl(217, 91%, 60%) 100%);
            border-radius: 16px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            font-family: 'Orbitron', monospace;
            position: relative;
            animation: pulse-cyber 2s ease-in-out infinite alternate;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
        }
        
        .station-logo::after {
            content: '';
            position: absolute;
            top: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            background: #ef4444;
            border-radius: 50%;
            animation: glow-pulse 2s infinite;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }
        
        .station-logo::before {
            content: '';
            position: absolute;
            top: -4px;
            right: -4px;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            z-index: 1;
        }
        
        @keyframes pulse-cyber {
            0% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.3); }
            100% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.6); }
        }
        
        @keyframes glow-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }
        
        .station-name {
            font-size: 24px;
            font-weight: bold;
            font-family: 'Orbitron', monospace;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .live-badge {
            background: hsl(0, 62.8%, 30.6%);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }
        
        .track-info {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        
        .track-title {
            font-size: 14px;
            font-weight: 500;
            font-family: 'Rajdhani', sans-serif;
            text-align: center;
            word-break: break-word;
            line-height: 1.4;
            animation: scroll-text 20s linear infinite;
        }
        
        @keyframes scroll-text {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        
        .play-button {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, hsl(263, 85%, 65%) 0%, hsl(217, 91%, 60%) 100%);
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.3);
        }
        
        .play-button:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(139, 92, 246, 0.4);
        }
        
        .play-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            padding: 0 10px;
        }
        
        .volume-slider {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: rgba(148, 163, 184, 0.2);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, hsl(263, 85%, 65%) 0%, hsl(217, 91%, 60%) 100%);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
        }
        
        .volume-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, hsl(263, 85%, 65%) 0%, hsl(217, 91%, 60%) 100%);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
        }
        
        .status {
            font-size: 14px;
            margin-top: 15px;
            opacity: 0.8;
            font-family: 'Rajdhani', sans-serif;
        }
        
        .error {
            color: #f87171;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 14px;
            font-family: 'Rajdhani', sans-serif;
        }
        
        .loading {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid hsl(263, 85%, 65%);
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="station-logo">D1</div>
        <div class="station-name">
            Dance One Radio
            <span class="live-badge">LIVE</span>
        </div>
        
        <div class="track-info">
            <div class="track-title" id="trackTitle">Loading...</div>
        </div>
        
        <div class="controls">
            <button class="play-button" id="playButton" onclick="togglePlay()">
                <span id="playIcon">▶</span>
                <div class="loading" id="loadingIcon" style="display: none;"></div>
            </button>
        </div>
        
        <div class="volume-container">
            <span>🔊</span>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
            <span id="volumeValue">70%</span>
        </div>
        
        <div class="status" id="status">Click play to start listening</div>
        <div class="error" id="error" style="display: none;"></div>
        
        <audio id="audioPlayer" preload="none"></audio>
    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playButton = document.getElementById('playButton');
        const playIcon = document.getElementById('playIcon');
        const loadingIcon = document.getElementById('loadingIcon');
        const trackTitle = document.getElementById('trackTitle');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const status = document.getElementById('status');
        const errorDiv = document.getElementById('error');
        
        const streamUrls = [
            "http://s9.myradiostream.com:14296/;",
            "http://s9.myradiostream.com:14296/stream", 
            "http://s9.myradiostream.com:14296",
            "https://live-radio-stream.online/dance-one-radio.mp3"
        ];
        let currentStreamIndex = 0;
        let isPlaying = false;
        let metadataInterval = null;
        let userHasInteracted = false;
        
        // Initialize audio with proper settings
        console.log('🎵 Initializing audio player');
        audio.volume = 0.7;
        audio.muted = false; // Explicitly unmute
        audio.crossOrigin = 'anonymous';
        console.log('🔊 Initial audio state - muted:', audio.muted, 'volume:', audio.volume);
        
        // Volume control
        volumeSlider.addEventListener('input', function() {
            const volume = this.value / 100;
            audio.volume = volume;
            volumeValue.textContent = this.value + '%';
        });
        
        // Audio event listeners
        audio.addEventListener('loadstart', () => {
            showLoading(true);
            setStatus('Loading stream...');
        });
        
        audio.addEventListener('canplay', () => {
            showLoading(false);
            setStatus('Ready to play');
        });
        
        audio.addEventListener('play', () => {
            isPlaying = true;
            playIcon.textContent = '⏸';
            setStatus('Playing live stream');
            startMetadataUpdates();
        });
        
        audio.addEventListener('pause', () => {
            isPlaying = false;
            playIcon.textContent = '▶';
            setStatus('Paused');
            stopMetadataUpdates();
        });
        
        audio.addEventListener('error', (e) => {
            showLoading(false);
            showError('Failed to load stream. Please try again.');
            setStatus('Error');
            console.error('Audio error:', e);
        });
        
        audio.addEventListener('stalled', () => {
            setStatus('Buffering...');
        });
        
        audio.addEventListener('waiting', () => {
            setStatus('Buffering...');
        });
        
        audio.addEventListener('playing', () => {
            setStatus('Playing live stream');
        });
        
        function togglePlay() {
            console.log('🎵 Toggle play clicked - Current state:', { isPlaying, audioSrc: audio.src, muted: audio.muted, volume: audio.volume });
            
            if (isPlaying) {
                console.log('⏸ Pausing audio');
                audio.pause();
                return;
            }
            
            // Start playback
            console.log('▶ Starting playback...');
            showLoading(true);
            hideError();
            tryCurrentStream();
        }
        
        function tryCurrentStream() {
            const currentUrl = streamUrls[currentStreamIndex];
            console.log(`🔗 Trying stream ${currentStreamIndex + 1}/${streamUrls.length}: ${currentUrl}`);
            
            // Configure audio
            audio.muted = false;
            audio.volume = 0.7;
            audio.src = currentUrl;
            audio.load();
            
            console.log('🎯 About to play - muted:', audio.muted, 'volume:', audio.volume, 'src:', audio.src);
            
            audio.play().then(() => {
                console.log('✅ Audio play() promise resolved successfully');
                showLoading(false);
            }).catch(err => {
                console.error(`❌ Stream ${currentStreamIndex + 1} failed:`, err);
                tryNextStream();
            });
        }
        
        function tryNextStream() {
            currentStreamIndex++;
            if (currentStreamIndex < streamUrls.length) {
                console.log(`🔄 Trying next stream (${currentStreamIndex + 1}/${streamUrls.length})`);
                setTimeout(tryCurrentStream, 1000); // Wait 1 second before trying next
            } else {
                console.log('❌ All streams failed');
                showLoading(false);
                showError('All stream sources failed. Please check your internet connection and try again.');
                currentStreamIndex = 0; // Reset for next attempt
            }
        }
        
        function showLoading(show) {
            loadingIcon.style.display = show ? 'block' : 'none';
            playIcon.style.display = show ? 'none' : 'block';
            playButton.disabled = show;
        }
        
        function setStatus(message) {
            status.textContent = message;
        }
        
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function hideError() {
            errorDiv.style.display = 'none';
        }
        
        function startMetadataUpdates() {
            if (metadataInterval) return;
            
            fetchMetadata(); // Initial fetch
            metadataInterval = setInterval(fetchMetadata, 10000); // Every 10 seconds
        }
        
        function stopMetadataUpdates() {
            if (metadataInterval) {
                clearInterval(metadataInterval);
                metadataInterval = null;
            }
        }
        
        async function fetchMetadata() {
            try {
                const response = await fetch('https://upbwlnpycrbhxahjztrf.supabase.co/functions/v1/stream-metadata', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwYndsbnB5Y3JiaHhhaGp6dHJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ3ODQ3MzQsImV4cCI6MjA3MDM2MDczNH0.3N7hPJIiHokZvHZQSnQqZl1xu2POj4FrNyVPMQxF55U'
                    },
                    body: JSON.stringify({})
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.title) {
                        trackTitle.textContent = data.title;
                    }
                }
            } catch (error) {
                console.error('Failed to fetch metadata:', error);
                // Don't show error for metadata failures
            }
        }
        
        // Initial metadata fetch
        fetchMetadata();
        
        // Cleanup on window unload
        window.addEventListener('beforeunload', () => {
            stopMetadataUpdates();
            if (audio && !audio.paused) {
                audio.pause();
            }
        });
    </script>
</body>
</html>
