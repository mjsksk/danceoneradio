<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dance One Radio - Live Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .player-container {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .station-logo {
            width: 80px;
            height: 80px;
            background: #ff6b6b;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }
        
        .station-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .track-info {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .track-title {
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            word-break: break-word;
        }
        
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        
        .play-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #ff6b6b;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .play-button:hover {
            background: #ff5252;
            transform: scale(1.1);
        }
        
        .play-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }
        
        .volume-slider {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff6b6b;
            cursor: pointer;
        }
        
        .volume-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff6b6b;
            cursor: pointer;
            border: none;
        }
        
        .status {
            font-size: 14px;
            margin-top: 15px;
            opacity: 0.8;
        }
        
        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 14px;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .live-badge {
            background: #ff0000;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="station-logo">D1</div>
        <div class="station-name">
            Dance One Radio
            <span class="live-badge">LIVE</span>
        </div>
        
        <div class="track-info">
            <div class="track-title" id="trackTitle">Loading...</div>
        </div>
        
        <div class="controls">
            <button class="play-button" id="playButton" onclick="togglePlay()">
                <span id="playIcon">▶</span>
                <div class="loading" id="loadingIcon" style="display: none;"></div>
            </button>
        </div>
        
        <div class="volume-container">
            <span>🔊</span>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
            <span id="volumeValue">70%</span>
        </div>
        
        <div class="status" id="status">Click play to start listening</div>
        <div class="error" id="error" style="display: none;"></div>
        
        <audio id="audioPlayer" preload="none"></audio>
    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playButton = document.getElementById('playButton');
        const playIcon = document.getElementById('playIcon');
        const loadingIcon = document.getElementById('loadingIcon');
        const trackTitle = document.getElementById('trackTitle');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const status = document.getElementById('status');
        const errorDiv = document.getElementById('error');
        
        const streamUrl = 'https://streams.radio.co/s2c3cc784b/listen';
        let isPlaying = false;
        let metadataInterval = null;
        let userHasInteracted = false;
        
        // Initialize audio with proper settings
        console.log('🎵 Initializing audio player');
        audio.volume = 0.7;
        audio.muted = false; // Explicitly unmute
        audio.crossOrigin = 'anonymous';
        console.log('🔊 Initial audio state - muted:', audio.muted, 'volume:', audio.volume);
        
        // Volume control
        volumeSlider.addEventListener('input', function() {
            const volume = this.value / 100;
            audio.volume = volume;
            volumeValue.textContent = this.value + '%';
        });
        
        // Audio event listeners
        audio.addEventListener('loadstart', () => {
            showLoading(true);
            setStatus('Loading stream...');
        });
        
        audio.addEventListener('canplay', () => {
            showLoading(false);
            setStatus('Ready to play');
        });
        
        audio.addEventListener('play', () => {
            isPlaying = true;
            playIcon.textContent = '⏸';
            setStatus('Playing live stream');
            startMetadataUpdates();
        });
        
        audio.addEventListener('pause', () => {
            isPlaying = false;
            playIcon.textContent = '▶';
            setStatus('Paused');
            stopMetadataUpdates();
        });
        
        audio.addEventListener('error', (e) => {
            showLoading(false);
            showError('Failed to load stream. Please try again.');
            setStatus('Error');
            console.error('Audio error:', e);
        });
        
        audio.addEventListener('stalled', () => {
            setStatus('Buffering...');
        });
        
        audio.addEventListener('waiting', () => {
            setStatus('Buffering...');
        });
        
        audio.addEventListener('playing', () => {
            setStatus('Playing live stream');
        });
        
        function togglePlay() {
            console.log('🎵 Toggle play clicked - Current state:', { isPlaying, audioSrc: audio.src, muted: audio.muted, volume: audio.volume });
            
            if (!audio.src) {
                console.log('🔗 Setting audio source to:', streamUrl);
                audio.src = streamUrl;
                // Force unmute and set volume
                audio.muted = false;
                audio.volume = 0.7;
                console.log('🔊 Audio configured - muted:', audio.muted, 'volume:', audio.volume);
            }
            
            if (isPlaying) {
                console.log('⏸ Pausing audio');
                audio.pause();
            } else {
                console.log('▶ Starting playback...');
                showLoading(true);
                hideError();
                
                // Ensure audio is properly configured before play
                audio.muted = false;
                audio.volume = 0.7;
                audio.load(); // Reload the audio element
                
                console.log('🎯 About to play - muted:', audio.muted, 'volume:', audio.volume, 'src:', audio.src);
                
                audio.play().then(() => {
                    console.log('✅ Audio play() promise resolved successfully');
                }).catch(err => {
                    console.error('❌ Audio play() promise rejected:', err);
                    showLoading(false);
                    showError(`Playback failed: ${err.message}. Try clicking again or check your browser's audio settings.`);
                });
            }
        }
        
        function showLoading(show) {
            loadingIcon.style.display = show ? 'block' : 'none';
            playIcon.style.display = show ? 'none' : 'block';
            playButton.disabled = show;
        }
        
        function setStatus(message) {
            status.textContent = message;
        }
        
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function hideError() {
            errorDiv.style.display = 'none';
        }
        
        function startMetadataUpdates() {
            if (metadataInterval) return;
            
            fetchMetadata(); // Initial fetch
            metadataInterval = setInterval(fetchMetadata, 10000); // Every 10 seconds
        }
        
        function stopMetadataUpdates() {
            if (metadataInterval) {
                clearInterval(metadataInterval);
                metadataInterval = null;
            }
        }
        
        async function fetchMetadata() {
            try {
                const response = await fetch('https://upbwlnpycrbhxahjztrf.supabase.co/functions/v1/stream-metadata', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwYndsbnB5Y3JiaHhhaGp6dHJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ3ODQ3MzQsImV4cCI6MjA3MDM2MDczNH0.3N7hPJIiHokZvHZQSnQqZl1xu2POj4FrNyVPMQxF55U'
                    },
                    body: JSON.stringify({})
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.title) {
                        trackTitle.textContent = data.title;
                    }
                }
            } catch (error) {
                console.error('Failed to fetch metadata:', error);
                // Don't show error for metadata failures
            }
        }
        
        // Initial metadata fetch
        fetchMetadata();
        
        // Cleanup on window unload
        window.addEventListener('beforeunload', () => {
            stopMetadataUpdates();
            if (audio && !audio.paused) {
                audio.pause();
            }
        });
    </script>
</body>
</html>
