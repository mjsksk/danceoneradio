[build]
  command = "npm run build && npx tsx scripts/generate-prerender.ts"
  publish = "dist"

# Prerendering configuration
[build.environment]
  NODE_VERSION = "18"

# Edge Functions configuration for bot detection
[[edge_functions]]
  function = "prerender"
  path = "/*"

# Headers for SEO and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://securepubads.g.doubleclick.net https://tpc.googlesyndication.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; connect-src 'self' https://upbwlnpycrbhxahjztrf.supabase.co wss://upbwlnpycrbhxahjztrf.supabase.co https://api.music.apple.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://www.google-analytics.com https://stats.g.doubleclick.net http://s9.myradiostream.com:14296; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache prerendered HTML files for bots (short cache for freshness)
[[headers]]
  for = "/*/index.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Redirect rules - preserve SPA routing
# Serve static files if they exist, otherwise serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Enable Netlify's prerendering for better SEO
[[plugins]]
  package = "@netlify/plugin-sitemap"
  
# Enable prerendering for better SEO
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true
